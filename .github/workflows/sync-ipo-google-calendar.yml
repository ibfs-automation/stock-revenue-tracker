name: Sync IPO calendar to Google Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser scraper
        run: |
          npm install
          npm install playwright@^1.52.0
          npx playwright install --with-deps chromium

      - name: Sync IPO calendar to Google Calendar
        env:
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          IPO_CALENDAR_DELETE_MISSING: "1"
        run: node scripts/sync-ipo-google-calendar.js
