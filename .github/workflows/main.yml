name: Update revenue data and publish Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "40,50 8 1-11 * *"
    - cron: "0 9 1-11 * *"
  push:
    branches:
      - main
    paths-ignore:
      - "public/data/revenue.json"
      - "public/data/monthly-revenue-*.xlsx"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Update revenue data
        run: node scripts/update-pages-data.js

      - name: Save generated revenue data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          node scripts/update-pages-data.js

          git add public/data
          if git diff --cached --quiet; then
            echo "No revenue data changes"
          else
            git commit -m "Update revenue snapshot [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
