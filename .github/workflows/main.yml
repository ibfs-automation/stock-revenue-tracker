name: Update revenue data and publish Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 1-13 * *"    # 台北 16:30（10、13日用於產出 Excel）
    - cron: "0 9 1-13 * *"     # 台北 17:00
    - cron: "0 10 1-13 * *"    # 台北 18:00
    - cron: "0 11 1-13 * *"    # 台北 19:00
    - cron: "0 12 1-13 * *"    # 台北 20:00
    - cron: "0 13 1-13 * *"    # 台北 21:00
  push:
    branches:
      - main
    paths:
      - "tracked-stocks.json"
      - "public/index.html"
      - "public/app.js"
      - "public/styles.css"
      - "scripts/update-pages-data.js"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Save generated revenue data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            node scripts/update-pages-data.js

            git add public/data
            if git diff --cached --quiet; then
              echo "No revenue data changes"
              break
            fi

            git commit -m "Update revenue snapshot [skip ci]"
            if git push; then
              echo "Pushed on attempt $attempt"
              break
            fi

            echo "Push rejected on attempt $attempt, retrying..."
            git reset HEAD~1
            sleep $((attempt * 10))
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
